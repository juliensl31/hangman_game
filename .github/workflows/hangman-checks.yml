name: Hangman checks

on:
  pull_request:
    paths:
      - 'script.js'
      - 'tests/**'
      - '.github/workflows/hangman-checks.yml'
  push:
    branches:
      - master
    paths:
      - 'script.js'
      - 'tests/**'
      - '.github/workflows/hangman-checks.yml'

permissions:
  contents: read

jobs:
  gameplay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Run gameplay tests
        run: node --test tests/game.test.js
